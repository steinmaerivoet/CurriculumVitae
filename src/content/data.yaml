# yaml-language-server: $schema=./data.schema.json
# ─────────────────────────────────────────────────────────────────────────────
#  All content of the website lives in this file.
#
#  - Change text, add items or remove them: the site adapts.
#  - To reorder the slides or hide a slide: see `slides`.
#  - The file is validated on every build. A mistake (e.g. a forgotten
#    required field) gives a clear message with the path.
#  - Source: LinkedIn profile (October 2026). Lines marked "TODO" still
#    need a look from you.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  title: Stein Maerivoet
  description: >-
    Stein Maerivoet, Lead Engineer at Belfius. Cloud-native backends, Java and
    Spring Boot, agentic software engineering and a lifelong love for automation.
  url: https://steinmaerivoet.dev
  lang: en

# Order and visibility of the slides. Leave out a line to hide that slide.
# Possible values: hero, about, experience, skills, projects, education, contact
slides:
  - hero
  - about
  - experience
  - skills
  - projects
  - education
  - contact

# Short texts in the navigation and buttons.
ui:
  introLabel: Intro
  scrollHint: Scroll
  talkButton: Let's talk
  contentsLabel: Contents
  footer: Built with Astro, React & GSAP
  # Bottom-right button that downloads the PDF version of this CV (generated at build time).
  downloadCv: Download CV
  # Bottom-right button that downloads a QR code to this site (PNG, generated at build time).
  downloadQr: Download QR code
  # Bottom-right button that downloads the share card (the image link previews show, with the QR code).
  downloadShareCard: Download share card
  # Clicking a download button first shows a preview of the file, with these buttons.
  downloadAction: Download
  closeAction: Close
  # Caption under each page of the PDF preview; {page} and {pages} are filled in.
  previewPage: "Page {page} of {pages}"
  # Caption next to the QR code at the top of the PDF, so someone with only the PDF finds the site.
  pdfQrCaption: Scan or click for the interactive CV
  # Caption next to the QR code on the share card.
  shareCardQrCaption: Scan for the interactive CV

person:
  firstName: Stein
  lastName: Maerivoet
  headline: Lead Engineer at Belfius
  tagline: >-
    A passionate engineer on a continuous quest to improve the efficiency of
    everything around me.
  location: Mechelen, Belgium
  # Public address; Cloudflare Email Routing forwards it to your own
  # mailbox (see CLOUDFLARE.md §7).
  email: hello@steinmaerivoet.dev
  # Set to true to show an "available" badge on the intro.
  available: false
  availabilityText: Open to new challenges
  socials:
    - label: LinkedIn
      url: https://www.linkedin.com/in/steinmaerivoet/
    - label: GitHub
      url: https://github.com/steinmaerivoet

about:
  label: About
  statement: Less about writing code. More about knowing what to build.
  paragraphs:
    - >-
      I'm a passionate engineer in a continuous quest for improving the
      efficiency of things I see around me. I'm highly committed and
      goal-oriented when something captures my interest, and you can always
      make my day with a conversation about IoT or home automation.
    - >-
      In my spare time you can find me on my bike, at my computer, or planning
      a backpacking journey to explore a new part of our planet.
  stats:
    - value: 10
      suffix: "+"
      label: Years of professional software engineering
    - value: 1
      suffix: "st"
      label: Prize at the Belfius hackathon
    # value: a number, or `technologies` / `skills` / `projects` to have it counted
    - value: technologies
      label: Technologies on my skill board

experience:
  label: Experience
  presentLabel: Present
  projectsLabel: Projects
  # One block per employer, as on LinkedIn.
  #   roles      positions at that employer, newest first (end: null = present)
  #   highlights short extra points (optional)
  #   tech       technologies. Names that match a skill become clickable
  #              and count towards "Used in" on the skills slide.
  # Projects live under `projects:` with `employer:` pointing to the company here.
  items:
    - company: Belfius
      location: Brussels, Belgium
      roles:
        - { title: Lead Engineer, start: "2026", end: null }
        - { title: Senior Engineer, start: "2023", end: "2026" }
      summary: >-
        Engineering in Belfius Technology, one of Belgium's largest banks:
        modernising how critical banking systems, cloud applications and
        external services talk to each other.
      tech: [Java 25, Spring Boot, PostgreSQL, Azure, Azure DevOps, Git, IntelliJ, Kubernetes, Operator pattern, Platform engineering, Helm, Docker, Istio, Backstage, Elastic, Playwright, BDD, Gherkin, Agentic AI, GitHub Copilot CLI, Spec-driven development, Jira, Confluence]

    - company: Ixor
      location: Mechelen, Belgium
      roles:
        - { title: Software Engineer, start: "2019", end: "2023" }
      summary: >-
        Backend development of web applications for a range of clients, with
        cloud-native microservices, event-driven architecture and AWS.
      tech: [Java, Spring Boot, Kafka, GraphQL, REST, Microservices, Event-driven, Git, IntelliJ, AWS, CloudFormation, Docker, Bitbucket Pipelines, Datadog, DDD, BDD, Gherkin, Selenium, Automated testing, GitHub Copilot, Jira, Confluence]

    - company: Objective International
      location: Wichelen, Belgium
      roles:
        - { title: Software Engineer, start: "2018", end: "2019" }
        - { title: Junior Software Engineer, start: "2016", end: "2017" }
      summary: >-
        Tailored the Objective Java framework for MES and WMS to customers in
        the process industry, through the full cycle from analysis to go-live.
        Later turned customer needs into technical designs, and owned the
        codebase and the releases.
      highlights:
        - On-site key-user training, fixes and installations during test phases
      tech: [Java, SQL, MSSQL, Git, IntelliJ, Jenkins, CI/CD, MES, WMS, VBA]

    - company: Winfri
      location: Ghent, Belgium
      roles:
        - { title: Co-founder & Software Engineer, start: "2015", end: "2015" }
      summary: >-
        Someone pitched me the idea of an online freecycle platform. I joined
        as co-entrepreneur and developer to turn it into a real company.
      highlights:
        - Startup Weekend Leuven, Durf Ondernemen (Ghent University) and Start it @KBC
      tech: [Scala, Play Framework, MongoDB]

    - company: Crelan
      location: Anderlecht, Belgium
      roles:
        - { title: Summer Student, start: "2011", end: "2013" }
      summary: >-
        Summer job in the home loan administration, where I spotted repetitive
        work in Excel and automated it.
      highlights:
        - Built VBA automations that saved the team time every day
      tech: [VBA, Excel]

skills:
  label: Skills
  title: The stack I build with
  # Texts on the skills slide
  allLabel: All
  kindLabels:
    technology: Technologies
    practice: Ways of working
    tool: Tools
  hint: Select a skill to see where I used it.
  usedInLabel: Used in
  # Hidden extra: network view of skills, experience and projects
  graphButton: Network
  graphTitle: How it all connects
  graphHint: Hover or tap to see the connections; click or tap again to go there.
  sinceLabel: Since
  yearsLabel: years
  levelLabels:
    expert: Expert
    advanced: Advanced
    familiar: Familiar
  # Per skill:
  #   name    name (required)
  #   level   expert | advanced | familiar            TODO: review
  #   since   year you started using it (otherwise derived from your experience)
  #   icon    logo: slug from https://simpleicons.org (e.g. kubernetes),
  #           or an Iconify name: lucide:<name> for concepts (https://lucide.dev/icons),
  #           devicon:<name> for logos Simple Icons doesn't have (e.g. devicon:azure)
  #   match   extra names to recognise it in the `tech` and `tags` of experience and projects
  # "Used in" is built automatically from `tech` (experience) and `tags` (projects).
  # Each group has a kind:
  #   technology  languages, frameworks, platforms (counts towards "technologies" on About)
  #   practice    ways of working and architecture
  #   tool        products and tools
  # The board never mixes kinds.
  groups:
    - name: Backend
      items:
        - { name: Java, level: expert, since: 2016, icon: devicon:java }
        - { name: Spring Boot, level: expert, since: 2019, icon: springboot }
        - { name: Kafka, level: advanced, since: 2019, icon: apachekafka }
        - { name: REST, level: expert, since: 2016, icon: openapiinitiative }
        - { name: GraphQL, level: advanced, since: 2019, icon: graphql }
        - { name: SQL, level: advanced, since: 2016, icon: lucide:database }
        # TODO: PostgreSQL is only listed at Belfius; add it to the `tech` of other employers where you used it.
        - { name: PostgreSQL, level: advanced, icon: postgresql, match: [Postgres] }
        - { name: Microsoft SQL Server, level: advanced, since: 2016, icon: devicon:microsoftsqlserver, match: [MSSQL, SQL Server] }
        - { name: Scala, level: familiar, since: 2015, icon: scala }
        - { name: Play Framework, level: familiar, since: 2015, icon: lucide:circle-play }
        - { name: MongoDB, level: familiar, since: 2015, icon: mongodb }
    - name: Cloud & platform
      items:
        - { name: Azure, level: advanced, since: 2023, icon: devicon:azure }
        - { name: AWS, level: advanced, since: 2019, icon: devicon:amazonwebservices, match: [CloudFormation] }
        - { name: Kubernetes, level: advanced, since: 2023, icon: kubernetes }
        - { name: Helm, level: advanced, since: 2026, icon: helm }
        - { name: Docker, level: advanced, since: 2019, icon: docker }
        - { name: Istio, level: advanced, since: 2026, icon: istio, match: [Service mesh] }
        - { name: Elastic, level: advanced, since: 2026, icon: elastic, match: [Kibana] }
        - { name: Datadog, level: advanced, since: 2019, icon: datadog }
    - name: Security
      items:
        # TODO: only linked to myVandelanotte for now; add it to `tech` wherever else you used it.
        - { name: OAuth2, level: advanced, since: 2021, icon: devicon:oauth }
        - { name: OpenID Connect, level: advanced, since: 2021, icon: openid, match: [OIDC] }
    - name: Testing
      items:
        - { name: Playwright, level: advanced, since: 2026, icon: devicon:playwright }
        - { name: Selenium, level: advanced, since: 2019, icon: selenium }
        - { name: Gherkin, level: advanced, since: 2019, icon: cucumber }
    - name: IoT
      items:
        - { name: Home Assistant, level: expert, since: 2017, icon: homeassistant }
        - { name: Raspberry Pi, level: advanced, since: 2017, icon: raspberrypi }
        - { name: ESP8266, level: advanced, since: 2017, icon: espressif }
        - { name: Sensors, level: advanced, since: 2014, icon: lucide:radar, match: [Embedded] }
    - name: Ways of working
      kind: practice
      items:
        - { name: Microservices, level: expert, since: 2019, icon: lucide:boxes }
        - { name: Event-driven architecture, level: expert, since: 2019, icon: lucide:zap, match: [Event-driven] }
        - { name: Platform engineering, level: advanced, since: 2023, icon: lucide:layers }
        - { name: Identity & SSO, level: advanced, since: 2021, icon: lucide:fingerprint, match: [SSO, Azure AD] }
        - { name: Domain-Driven Design, level: advanced, since: 2019, icon: lucide:shapes, match: [DDD] }
        - { name: Operator pattern, level: advanced, since: 2026, icon: lucide:refresh-cw }
        - { name: CI/CD, level: expert, since: 2018, icon: lucide:infinity, match: [Jenkins] }
        - { name: Automated testing, level: expert, since: 2016, icon: junit5 }
        - { name: BDD, level: advanced, since: 2019, icon: lucide:list-checks }
        - { name: Spec-driven development, level: advanced, since: 2025, icon: lucide:clipboard-check }
        - { name: Agentic AI, level: advanced, since: 2025, icon: lucide:sparkles, match: [AI] }
        - { name: Automation, level: expert, since: 2011, icon: lucide:workflow, match: [VBA] }
    - name: Tools
      kind: tool
      items:
        - { name: Git, level: expert, since: 2016, icon: git }
        - { name: Azure DevOps, level: advanced, since: 2023, icon: devicon:azuredevops }
        - { name: GitHub Copilot, level: advanced, since: 2022, icon: githubcopilot }
        - { name: Claude Code, level: advanced, since: 2025, icon: claudecode }
        - { name: Cursor, level: familiar, icon: cursor }
        # TODO: IntelliJ and VS Code at your employers are a guess; fix `tech` if that is wrong.
        - { name: IntelliJ IDEA, level: expert, since: 2016, icon: intellijidea, match: [IntelliJ] }
        - { name: Visual Studio Code, level: advanced, icon: devicon:vscode, match: [VS Code] }
        - { name: Backstage, level: familiar, since: 2026, icon: backstage }
        # TODO: Jira and Confluence are linked to Belfius and Ixor; fix `tech` if that is wrong.
        - { name: Jira, level: advanced, since: 2019, icon: jira }
        - { name: Confluence, level: advanced, since: 2019, icon: confluence }
        - { name: Bitbucket, level: advanced, since: 2019, icon: bitbucket, match: [Bitbucket Pipelines] }

projects:
  label: Projects
  # All projects, once each. They are linked to the rest:
  #   employer  company name as under `experience` (wrong = build fails)
  #   tags      names that match a skill become links to that skill
  #   featured  true = card on the projects slide (keep it at 6)
  # The experience slide lists each employer's projects, in this order.
  # summary is the short text on the card; description the full explanation.
  items:
    - name: Cloud-native integration platform
      employer: Belfius
      period: 2023 – Present
      featured: true
      meta: Belfius · Kubernetes Operator
      summary: >-
        Cloud-native platform modernising communication between critical
        banking systems, cloud applications and external services, with a custom
        Kubernetes Operator for declarative, self-service integrations.
      description:
        - >-
          Architected and developed a cloud-native integration platform
          modernizing communication between critical banking systems, cloud
          applications, and external services. Designed a scalable, distributed
          architecture leveraging Java, Spring Boot, and Kubernetes.
        - >-
          Applied platform engineering principles by developing a custom
          Kubernetes Operator, enabling declarative configuration, automated
          lifecycle management, and developer self-service. Leveraged Helm and
          Kubernetes-native automation to simplify enterprise integrations and
          streamline software delivery.
      tags: [Java, Spring Boot, Kubernetes, Operator pattern, Platform engineering, Helm]

    - name: Belfius Hackathon
      employer: Belfius
      featured: true
      meta: First prize · 48 hours
      description: >-
        Pitched an idea, built a working prototype through the night and
        presented it to a jury from Belfius management and Mistral AI.
      tags: [AI, Prototype, Pitch]

    - name: Flemish Traffic Centre
      employer: Ixor
      period: 2022 – 2023
      featured: true
      summary: >-
        Application for operators to control the traffic in Flanders, integrating
        Waze, DATEX, video walls, traffic signs and vehicle detection loops.
      description: >-
        Application for operators to control the traffic in Flanders: an
        event-driven microservice architecture integrating Waze, DATEX, video
        walls, traffic signs and vehicle detection loops.
      tags: [Event-driven, Kafka, Microservices, Spring Boot]

    - name: myVandelanotte
      employer: Ixor
      period: 2021 – 2022
      url: https://www.vandelanotte.be/en/myvandelanotte
      description: >-
        Client portal built from scratch that connects accountancy tools through
        Azure AD single sign-on, so clients find their statements, reports and
        documents to sign in one place.
      tags: [Spring Boot, Azure AD, OAuth2, OIDC, GraphQL]

    - name: E-invoicing for Belfius
      employer: Ixor
      period: 2020 – 2021
      featured: true
      url: https://www.youtube.com/watch?v=x5VHU6d7-I0
      description: >-
        New e-invoicing platform: upload a PDF invoice, have it recognised, and
        send it in a structured way over the PEPPOL network.
      tags: [PEPPOL, AWS, Document recognition]

    - name: IxorDocs
      employer: Ixor
      period: 2019 – 2020
      url: https://www.ixordocs.be/
      description: >-
        Portal connecting companies to Doccle (document platform) and PEPPOL
        (e-invoicing). Reworked the preprocessor engine that turns XML, PDF and
        CSV into output formats like PEPPOL BIS3.
      tags: [PEPPOL, Doccle, Java, AWS]

    - name: Release automation
      employer: Objective International
      period: 2018 – 2019
      description: >-
        Introduced Jenkins, which became the standard for building and shipping
        releases, and built a cloud-based tool that pushes new releases to
        customers automatically.
      tags: [Jenkins, CI/CD, Automation]

    - name: Winfri platform
      employer: Winfri
      period: "2015"
      description: >-
        Online freecycle platform built on Scala and the Play Framework with
        MongoDB. It grew to more than a thousand users.
      tags: [Scala, Play Framework, MongoDB]

    - name: Home automation
      featured: true
      meta: Since 2017
      description: >-
        It started with a Raspberry Pi, a temperature sensor and a flashed smart
        socket. Today my mission is to automate every repetitive task at home.
      url: https://github.com/steinmaerivoet/home-assistant-config
      tags: [Home Assistant, Raspberry Pi, ESP8266, Event-driven, BDD, Claude Code]

    - name: This website
      meta: Pet project · 2026
      url: https://steinmaerivoet.dev
      description: >-
        This CV as a vertical slideshow with magnet snapping, where skills,
        experience and projects link to each other. Built with Claude Code and
        tested with Playwright on desktop and mobile.
      tags: [Astro, React, TypeScript, Tailwind CSS, GSAP, Playwright, Claude Code, VS Code]

    # TODO: fill in the year, a short summary and the technologies.
    - name: Wedding website
      meta: Pet project
      description: >-
        Website for our wedding, with RSVP for the guests.
      tags: [Cursor, RSVP]

    - name: Multicopter safety system
      featured: true
      meta: Master thesis · Cum laude
      description: >-
        Obstacle detection for a multicopter with a ring of eight ultrasonic
        sensors, an AHRS and real-time correction of the S.Bus flight signals.
      tags: [Embedded, Sensors, Research]

