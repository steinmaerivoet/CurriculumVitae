about:
  label: About
  statement: >-
    Software engineering is becoming less about knowing how to write code, and
    more about knowing what to build.
  paragraphs:
    - >-
      I'm a passionate engineer in a continuous quest for improving the
      efficiency of things I see around me. I'm highly committed and
      goal-oriented when something captures my interest, and you can always
      make my day with a conversation about IoT or home automation.
    - >-
      In my spare time you can find me on my bike, at my computer, or planning
      a backpacking journey to explore a new part of our planet.
  stats:
    - value: 10
      suffix: "+"
      label: Years of professional software engineering
    - value: 1
      suffix: "st"
      label: Prize at the Belfius hackathon
    - value: 4
      label: Languages spoken

experience:
  label: Experience
  presentLabel: Present
  projectsLabel: Projects
  # Eén blok per werkgever, zoals op LinkedIn.
  #   roles      functies bij die werkgever, nieuwste eerst (end: null = heden)
  #   projects   projecten bij die werkgever, los van de functietitels
  #              (de eerste staat open; period en url zijn optioneel)
  #   highlights korte extra punten (optioneel)
  #   tech       technologieën; voedt ook "Used in" op de skills-slide
  items:
    - company: Belfius
      location: Brussels, Belgium
      roles:
        - { title: Lead Engineer, start: "2026", end: null }
        - { title: Senior Engineer, start: "2023", end: "2026" }
      summary: >-
        Engineering in Belfius Technology, one of Belgium's largest banks:
        modernising how critical banking systems, cloud applications and
        external services talk to each other.
      projects:
        - name: Cloud-native integration platform
          description:
            - >-
              Architected and developed a cloud-native integration platform
              modernizing communication between critical banking systems, cloud
              applications, and external services. Designed a scalable,
              distributed architecture leveraging Java, Spring Boot, and
              Kubernetes.
            - >-
              Applied platform engineering principles by developing a custom
              Kubernetes Operator, enabling declarative configuration, automated
              lifecycle management, and developer self-service. Leveraged Helm
              and Kubernetes-native automation to simplify enterprise
              integrations and streamline software delivery.
        - name: Belfius Hackathon
          period: First prize
          description: >-
            Pitched an idea, built a working prototype in 48 hours and presented
            it to a jury from Belfius management and Mistral AI.
      tech: [Java 25, Spring Boot, Azure, Azure DevOps, Kubernetes, Operator pattern, Helm, Istio, Backstage, Elastic, Agentic AI, GitHub Copilot CLI, Spec-driven development]

    - company: Ixor
      location: Mechelen, Belgium
      roles:
        - { title: Software Engineer, start: "2019", end: "2023" }
      summary: >-
        Backend development of web applications for a range of clients, with
        cloud-native microservices, event-driven architecture and AWS.
      projects:
        - name: Verkeerscentrum
          period: 2022 – 2023
          description: >-
            Application for operators to control the traffic in Flanders: an
            event-driven microservice architecture integrating Waze, DATEX,
            video walls, traffic signs and vehicle detection loops.
        - name: myVandelanotte
          period: 2021 – 2022
          url: https://www.vandelanotte.be/en/myvandelanotte
          description: >-
            Client portal built from scratch that connects accountancy tools
            through Azure AD single sign-on, so clients find their statements,
            reports and documents to sign in one place.
        - name: E-invoicing for Belfius
          period: 2020 – 2021
          url: https://www.youtube.com/watch?v=x5VHU6d7-I0
          description: >-
            New e-invoicing platform: upload a PDF invoice, have it recognised,
            and send it in a structured way over the PEPPOL network.
        - name: IxorDocs
          period: 2019 – 2020
          url: https://www.ixordocs.be/
          description: >-
            Portal connecting companies to Doccle (document platform) and PEPPOL
            (e-invoicing). Reworked the preprocessor engine that turns XML, PDF
            and CSV into output formats like PEPPOL BIS3.
      tech: [Java, Spring Boot, Kafka, GraphQL, REST, AWS, CloudFormation, Datadog, DDD, BDD, Automated testing]

    - company: Objective International
      location: Wichelen, Belgium
      roles:
        - { title: Software Engineer, start: "2018", end: "2019" }
        - { title: Junior Software Engineer, start: "2016", end: "2017" }
      summary: >-
        Tailored the Objective Java framework for MES and WMS to customers in
        the process industry, through the full cycle from analysis to go-live.
        Later turned customer needs into technical designs, and owned the
        codebase and the releases.
      highlights:
        - Introduced Jenkins, which became the standard for building and shipping releases
        - Built a cloud-based tool that pushes new releases to customers automatically
        - On-site key-user training, fixes and installations during test phases
      tech: [Java, SQL, Jenkins, CI/CD, MES, WMS, VBA]

    - company: Winfri
      location: Ghent, Belgium
      roles:
        - { title: Co-founder & Software Engineer, start: "2015", end: "2015" }
      summary: >-
        Someone pitched me the idea of an online freecycle platform. I joined
        as co-entrepreneur and developer to turn it into a real company.
      projects:
        - name: Winfri platform
          period: "2015"
          description: >-
            Built the freecycle platform on Scala and the Play Framework with
            MongoDB. It grew to more than a thousand users.
      highlights:
        - Startup Weekend Leuven, Durf Ondernemen (Ghent University) and Start it @KBC
      tech: [Scala, Play Framework, MongoDB]

    - company: Crelan
      location: Anderlecht, Belgium
      roles:
        - { title: Summer Student, start: "2011", end: "2013" }
      summary: >-
        Summer job in the home loan administration, where I spotted repetitive
        work in Excel and automated it.
      highlights:
        - Built VBA automations that saved the team time every day
      tech: [VBA, Excel]

