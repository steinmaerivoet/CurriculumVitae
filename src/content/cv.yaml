        - { name: Domain-Driven Design, level: advanced, since: 2019, icon: lucide:shapes, match: [DDD] }
        - { name: SQL, level: advanced, since: 2016, icon: lucide:database }
        - { name: Scala, level: familiar, since: 2015, icon: scala }
    - name: Cloud & platform
