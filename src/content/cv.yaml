# ─────────────────────────────────────────────────────────────────────────────
#  Alle inhoud van de website staat in dit bestand.
#
#  - Pas tekst aan, voeg items toe of verwijder ze: de site past zich aan.
#  - Volgorde van de slides wijzigen of een slide verbergen: zie `slides`.
#  - Het bestand wordt bij elke build gecontroleerd. Een fout (bv. een
#    verplicht veld vergeten) geeft een duidelijke melding met het pad.
#  - Bron: LinkedIn-profiel (oktober 2026). Regels met "TODO" verdienen nog
#    een blik van jou.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  title: Stein Maerivoet
  description: >-
    Stein Maerivoet, Lead Engineer at Belfius. Cloud-native backends, Java and
    Spring Boot, agentic software engineering and a lifelong love for automation.
  url: https://steinmaerivoet.dev
  lang: en

# Volgorde en zichtbaarheid van de slides. Laat een regel weg om de slide te verbergen.
# Mogelijke waarden: hero, about, experience, skills, projects, education, contact
slides:
  - hero
  - about
  - experience
  - skills
  - projects
  - education
  - contact

# Kleine teksten in de navigatie en knoppen.
ui:
  introLabel: Intro
  scrollHint: Scroll
  talkButton: Let's talk
  contentsLabel: Contents
  footer: Built with Astro, React & GSAP
  # Knop rechtsonder die de PDF-versie van dit CV downloadt (gegenereerd bij de build).
  downloadCv: Download CV
  # Knop rechtsonder die een QR-code naar deze site downloadt (PNG, gegenereerd bij de build).
  downloadQr: Download QR code

