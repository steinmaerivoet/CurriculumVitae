projects:
  label: Projects
  # Alle projecten, één keer. Ze worden aan de rest gekoppeld:
  #   employer  bedrijfsnaam zoals onder `experience` (fout = build faalt)
  #   tags      namen die overeenkomen met een skill worden links naar die skill
  #   featured  true = kaart op de projects-slide (hou het op 6)
  # Op de experience-slide staan de projecten van elke werkgever, in deze volgorde.
  # summary is de korte tekst op de kaart; description de volledige uitleg.
  items:
    - name: Cloud-native integration platform
      employer: Belfius
      period: 2023 – Present
      featured: true
      meta: Belfius · Kubernetes Operator
      summary: >-
        Cloud-native platform modernising communication between critical
        banking systems, cloud applications and external services, with a custom
        Kubernetes Operator for declarative, self-service integrations.
      description:
        - >-
          Architected and developed a cloud-native integration platform
          modernizing communication between critical banking systems, cloud
          applications, and external services. Designed a scalable, distributed
          architecture leveraging Java, Spring Boot, and Kubernetes.
        - >-
          Applied platform engineering principles by developing a custom
          Kubernetes Operator, enabling declarative configuration, automated
          lifecycle management, and developer self-service. Leveraged Helm and
          Kubernetes-native automation to simplify enterprise integrations and
          streamline software delivery.
      tags: [Java, Spring Boot, Kubernetes, Operator pattern, Platform engineering, Helm]

    - name: Belfius Hackathon
      employer: Belfius
      featured: true
      meta: First prize · 48 hours
      description: >-
        Pitched an idea, built a working prototype through the night and
        presented it to a jury from Belfius management and Mistral AI.
      tags: [AI, Prototype, Pitch]

    - name: Verkeerscentrum
      employer: Ixor
      period: 2022 – 2023
      featured: true
      summary: >-
        Application for operators to control the traffic in Flanders, integrating
        Waze, DATEX, video walls, traffic signs and vehicle detection loops.
      description: >-
        Application for operators to control the traffic in Flanders: an
        event-driven microservice architecture integrating Waze, DATEX, video
        walls, traffic signs and vehicle detection loops.
      tags: [Event-driven, Kafka, Microservices, Spring Boot]

    - name: myVandelanotte
      employer: Ixor
      period: 2021 – 2022
      url: https://www.vandelanotte.be/en/myvandelanotte
      description: >-
        Client portal built from scratch that connects accountancy tools through
        Azure AD single sign-on, so clients find their statements, reports and
        documents to sign in one place.
      tags: [Spring Boot, Azure AD, OAuth2, OIDC, GraphQL]

    - name: E-invoicing for Belfius
      employer: Ixor
      period: 2020 – 2021
      featured: true
      url: https://www.youtube.com/watch?v=x5VHU6d7-I0
      description: >-
        New e-invoicing platform: upload a PDF invoice, have it recognised, and
        send it in a structured way over the PEPPOL network.
      tags: [PEPPOL, AWS, Document recognition]

    - name: IxorDocs
      employer: Ixor
      period: 2019 – 2020
      url: https://www.ixordocs.be/
      description: >-
        Portal connecting companies to Doccle (document platform) and PEPPOL
        (e-invoicing). Reworked the preprocessor engine that turns XML, PDF and
        CSV into output formats like PEPPOL BIS3.
      tags: [PEPPOL, Doccle, Java, AWS]

    - name: Release automation
      employer: Objective International
      period: 2018 – 2019
      description: >-
        Introduced Jenkins, which became the standard for building and shipping
        releases, and built a cloud-based tool that pushes new releases to
        customers automatically.
      tags: [Jenkins, CI/CD, Automation]

    - name: Winfri platform
      employer: Winfri
      period: "2015"
      description: >-
        Online freecycle platform built on Scala and the Play Framework with
        MongoDB. It grew to more than a thousand users.
      tags: [Scala, Play Framework, MongoDB]

    - name: Home automation
      featured: true
      meta: Since 2017
      description: >-
        It started with a Raspberry Pi, a temperature sensor and a flashed smart
        socket. Today my mission is to automate every repetitive task at home.
      url: https://github.com/steinmaerivoet/home-assistant-config
      tags: [Home Assistant, Raspberry Pi, ESP8266, Event-driven, BDD, Claude Code]

    - name: This website
      meta: Pet project · 2026
      url: https://steinmaerivoet.dev
      description: >-
        This CV as a vertical slideshow with magnet snapping, where skills,
        experience and projects link to each other. Built with Claude Code and
        tested with Playwright on desktop and mobile.
      tags: [Astro, React, TypeScript, Tailwind CSS, GSAP, Playwright, Claude Code, VS Code]

    # TODO: vul jaar, korte omschrijving en technologieën aan.
    - name: Wedding website
      meta: Pet project
      description: >-
        Website for our wedding, with RSVP for the guests.
      tags: [Cursor, RSVP]

    - name: Multicopter safety system
      featured: true
      meta: Master thesis · Cum laude
      description: >-
        Obstacle detection for a multicopter with a ring of eight ultrasonic
        sensors, an AHRS and real-time correction of the S.Bus flight signals.
      tags: [Embedded, Sensors, Research]

