        - { name: AWS, level: advanced, since: 2019, icon: devicon:amazonwebservices, match: [CloudFormation] }
        - { name: Kubernetes, level: advanced, since: 2023, icon: kubernetes }
        - { name: Operator pattern, level: advanced, since: 2026, icon: lucide:refresh-cw }
        - { name: Helm, level: advanced, since: 2026, icon: helm }
        - { name: Istio, level: advanced, since: 2026, icon: istio }
